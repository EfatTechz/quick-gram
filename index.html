<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Quick Gram</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>


<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }


    body {

        font-family: Arial, sans-serif;

        background: #f4f7fb;

        color: #111827;

        min-height: 100vh;

    }


    .app {

        max-width: 600px;

        margin: auto;

        padding: 20px;

    }


    .header {

        display: flex;

        align-items: center;

        gap: 12px;

        margin-bottom: 25px;

    }


    .logo {

        width: 52px;

        height: 52px;

        border-radius: 16px;

        background: #229ed9;

        display: flex;

        align-items: center;

        justify-content: center;

        color: white;

        font-size: 25px;

        font-weight: bold;

    }


    .header h1 {

        font-size: 24px;

    }


    .header p {

        color: #6b7280;

        margin-top: 3px;

    }


    .balance {

        background: linear-gradient(
            135deg,
            #229ed9,
            #1677b8
        );

        color: white;

        padding: 25px;

        border-radius: 22px;

        margin-bottom: 20px;

        box-shadow:
            0 10px 25px
            rgba(34,158,217,.25);

    }


    .balance-title {

        opacity: .85;

        font-size: 14px;

    }


    .balance-number {

        font-size: 38px;

        font-weight: bold;

        margin-top: 8px;

    }


    .coin {

        font-size: 18px;

    }


    .grid {

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 14px;

    }


    .card {

        background: white;

        border-radius: 18px;

        padding: 22px;

        text-align: center;

        box-shadow:
            0 5px 18px
            rgba(0,0,0,.06);

        cursor: pointer;

        transition: .15s;

    }


    .card:active {

        transform: scale(.97);

    }


    .icon {

        font-size: 30px;

        margin-bottom: 10px;

    }


    .card h3 {

        font-size: 16px;

        margin-bottom: 5px;

    }


    .card p {

        font-size: 12px;

        color: #6b7280;

    }


    .welcome {

        background: white;

        border-radius: 18px;

        padding: 20px;

        margin-top: 20px;

    }


    .welcome h2 {

        font-size: 18px;

        margin-bottom: 8px;

    }


    .welcome p {

        color: #6b7280;

        line-height: 1.5;

    }


    .loading {

        text-align: center;

        margin-top: 30px;

        color: #6b7280;

    }


    /* ================================
       REFERRAL PAGE
    ================================= */

    .referral-card {

        background: white;

        border-radius: 20px;

        padding: 22px;

        box-shadow:
            0 5px 18px
            rgba(0,0,0,.06);

    }


    .referral-card h2 {

        margin-bottom: 10px;

    }


    .referral-card > p {

        color: #6b7280;

        line-height: 1.5;

    }


    .stats {

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 12px;

        margin-top: 18px;

    }


    .stat {

        background: #f4f7fb;

        border-radius: 14px;

        padding: 15px;

        text-align: center;

    }


    .stat-title {

        color: #6b7280;

        font-size: 12px;

        margin-bottom: 6px;

    }


    .stat-number {

        font-size: 22px;

        font-weight: bold;

    }


    .referral-code {

        margin-top: 15px;

        padding: 14px;

        background: #f4f7fb;

        border-radius: 10px;

        text-align: center;

        font-weight: bold;

    }


    .referral-link-box {

        width: 100%;

        margin-top: 18px;

        padding: 13px;

        border: 1px solid #d1d5db;

        border-radius: 10px;

        background: #f9fafb;

        color: #111827;

        font-size: 13px;

    }


    .referral-button {

        width: 100%;

        border: none;

        border-radius: 12px;

        padding: 14px;

        margin-top: 12px;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

    }


    .copy-button {

        background: #229ed9;

        color: white;

    }


    .share-button {

        background: #16a34a;

        color: white;

    }


    .back-button {

        background: #e5e7eb;

        color: #111827;

    }

</style>

</head><body><div class="app" id="mainApp"><!-- HEADER -->

<div class="header">

    <div class="logo">

        Q

    </div>


    <div>

        <h1>

            Quick Gram

        </h1>


        <p id="username">

            Connecting...

        </p>

    </div>

</div>


<!-- BALANCE -->

<div class="balance">

    <div class="balance-title">

        Your Balance

    </div>


    <div class="balance-number">

        <span id="balance">

            0

        </span>


        <span class="coin">

            Quicks

        </span>

    </div>

</div>


<!-- MENU -->

<div class="grid">


    <!-- EARN -->

    <div
        class="card"
        onclick="watchAd()"
    >

        <div class="icon">

            📺

        </div>


        <h3>

            Earn

        </h3>


        <p>

            Watch ads and earn

        </p>

    </div>


    <!-- TASKS -->

    <div
        class="card"
        onclick="openPage('tasks')"
    >

        <div class="icon">

            📝

        </div>


        <h3>

            Tasks

        </h3>


        <p>

            Complete tasks

        </p>

    </div>


    <!-- REFER -->

    <div
        class="card"
        onclick="openPage('referral')"
    >

        <div class="icon">

            👥

        </div>


        <h3>

            Refer

        </h3>


        <p>

            Invite friends

        </p>

    </div>


    <!-- WITHDRAW -->

    <div
        class="card"
        onclick="openPage('withdraw')"
    >

        <div class="icon">

            💰

        </div>


        <h3>

            Withdraw

        </h3>


        <p>

            Withdraw Quicks

        </p>

    </div>

</div>


<!-- WELCOME -->

<div class="welcome">

    <h2>

        Welcome to Quick Gram! 👋

    </h2>


    <p>

        Complete tasks, watch ads and
        invite friends to earn Quicks.

    </p>

</div>


<div
    id="loading"
    class="loading"
>

    Connecting to Quick Gram...

</div>

</div><script>


// =====================================
// TELEGRAM
// =====================================

const tg =
    window.Telegram.WebApp;

tg.ready();

tg.expand();


// =====================================
// QUICK GRAM API
// =====================================

const API_URL =
    "https://quick-gram-api.onrender.com";


// =====================================
// BOT USERNAME
// =====================================

const BOT_USERNAME =
    "Quick_Gram_bot";


// =====================================
// REFERRAL REWARD
// =====================================

const REFERRAL_REWARD =
    100;


// =====================================
// CURRENT USER
// =====================================

let currentUser = null;


// =====================================
// CONNECT USER
// =====================================

async function connectUser() {

    try {

        const initData =
            tg.initData;


        if (!initData) {

            throw new Error(
                "Telegram authentication data missing"
            );

        }


        const response =
            await fetch(
                API_URL + "/api/auth",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        initData:
                            initData
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Authentication failed"
            );

        }


        currentUser =
            data.user;


        // USER NAME

        const name =
            currentUser.first_name ||
            "User";


        document.getElementById(
            "username"
        ).textContent =
            "Hello, " + name + "!";


        // MAIN BALANCE

        updateBalance(
            currentUser.balance
        );


        document.getElementById(
            "loading"
        ).textContent =
            "Account connected ✓";


        return currentUser;


    } catch (error) {

        console.error(
            "Connection error:",
            error
        );


        document.getElementById(
            "username"
        ).textContent =
            "Connection failed";


        document.getElementById(
            "loading"
        ).textContent =
            error.message;


        tg.showAlert(
            "Could not connect to Quick Gram."
        );


        return null;

    }

}


// =====================================
// UPDATE BALANCE
// =====================================

function updateBalance(balance) {

    document.getElementById(
        "balance"
    ).textContent =
        Number(
            balance || 0
        ).toLocaleString();

}


// =====================================
// ADSGRAM
// =====================================

let AdController = null;


try {

    if (window.Adsgram) {

        AdController =
            window.Adsgram.init({

                blockId:
                    "45521"

            });

    }

} catch (error) {

    console.error(
        "AdsGram initialization error:",
        error
    );

}


// =====================================
// WATCH AD
// =====================================

async function watchAd() {

    try {

        if (!AdController) {

            tg.showAlert(
                "Ads are not available right now."
            );

            return;

        }


        const result =
            await AdController.show();


        console.log(
            "Ad completed:",
            result
        );


        tg.showAlert(
            "Ad completed! Reward will be added."
        );


    } catch (error) {

        console.error(
            "AdsGram error:",
            error
        );


        tg.showAlert(
            "No ad available right now. Please try again."
        );

    }

}


// =====================================
// OPEN PAGE
// =====================================

function openPage(page) {


    // =================================
    // REFERRAL PAGE
    // =================================

    if (page === "referral") {

        if (!currentUser) {

            tg.showAlert(
                "Please wait for your account to connect."
            );

            return;

        }


        const telegramUser =
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user;


        if (!telegramUser) {

            tg.showAlert(
                "Please open Quick Gram inside Telegram."
            );

            return;

        }


        // PERSONAL REFERRAL CODE

        const referralCode =
            currentUser.referral_code ||
            (
                "QG" +
                String(
                    telegramUser.id
                ).slice(-8)
            );


        // PERSONAL REFERRAL LINK

        const referralLink =
            "https://t.me/" +
            BOT_USERNAME +
            "?start=ref_" +
            referralCode;


        // REFERRAL COUNT

        const referralCount =
            Number(
                currentUser.referral_count ||
                0
            );


        // EARNINGS

        const referralEarnings =
            referralCount *
            REFERRAL_REWARD;


        // REPLACE PAGE

        document.getElementById(
            "mainApp"
        ).innerHTML = `

            <div class="header">

                <div class="logo">

                    Q

                </div>


                <div>

                    <h1>

                        Quick Gram

                    </h1>


                    <p>

                        Refer & Earn

                    </p>

                </div>

            </div>


            <div class="referral-card">

                <h2>

                    👥 Refer & Earn

                </h2>


                <p>

                    Invite your friends to
                    join Quick Gram and earn
                    <b>100 Quicks</b> for every
                    successful referral.

                </p>


                <div class="stats">


                    <div class="stat">

                        <div class="stat-title">

                            👥 Referrals

                        </div>


                        <div
                            class="stat-number"
                            id="referralCount"
                        >

                            ${referralCount}

                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-title">

                            💰 Referral Earnings

                        </div>


                        <div
                            class="stat-number"
                            id="referralEarnings"
                        >

                            ${referralEarnings}

                        </div>

                    </div>

                </div>


                <div class="referral-code">

                    Your Referral Code:

                    <br><br>

                    ${referralCode}

                </div>


                <input
                    id="referralLink"
                    class="referral-link-box"
                    type="text"
                    value="${referralLink}"
                    readonly
                >


                <button
                    class="referral-button copy-button"
                    onclick="copyReferralLink()"
                >

                    📋 Copy Referral Link

                </button>


                <button
                    class="referral-button share-button"
                    onclick="shareReferralLink()"
                >

                    📤 Share Referral Link

                </button>


                <button
                    class="referral-button back-button"
                    onclick="goBackHome()"
                >

                    ← Back

                </button>

            </div>

        `;


        return;

    }


    // =================================
    // OTHER PAGES
    // =================================

    tg.showAlert(
        page.toUpperCase() +
        " will be added soon!"
    );

}


// =====================================
// COPY REFERRAL LINK
// =====================================

async function copyReferralLink() {

    const input =
        document.getElementById(
            "referralLink"
        );


    if (!input) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            input.value
        );


        tg.showAlert(
            "Referral link copied! 📋"
        );


    } catch (error) {

        input.select();

        input.setSelectionRange(
            0,
            99999
        );


        document.execCommand(
            "copy"
        );


        tg.showAlert(
            "Referral link copied! 📋"
        );

    }

}


// =====================================
// SHARE REFERRAL LINK
// =====================================

function shareReferralLink() {

    const input =
        document.getElementById(
            "referralLink"
        );


    if (!input) {
        return;
    }


    const referralLink =
        input.value;


    const message =
        "🚀 Join Quick Gram and earn Quicks!";


    const shareUrl =
        "https://t.me/share/url?url=" +
        encodeURIComponent(
            referralLink
        ) +
        "&text=" +
        encodeURIComponent(
            message
        );


    tg.openTelegramLink(
        shareUrl
    );

}


// =====================================
// BACK HOME
// =====================================

function goBackHome() {

    location.reload();

}


// =====================================
// PROCESS REFERRAL
// =====================================

async function processReferral() {

    try {

        // -----------------------------
        // FIRST CHECK URL
        // -----------------------------

        const params =
            new URLSearchParams(
                window.location.search
            );


        let referralCode =
            params.get("ref");


        // -----------------------------
        // ALSO CHECK TELEGRAM START PARAM
        // -----------------------------

        if (!referralCode) {

            const startParam =
                tg.initDataUnsafe &&
                tg.initDataUnsafe.start_param;


            if (
                startParam &&
                startParam.startsWith("ref_")
            ) {

                referralCode =
                    startParam.substring(4);

            }

        }


        if (!referralCode) {

            return;

        }


        const initData =
            tg.initData;


        if (!initData) {

            return;

        }


        console.log(
            "Processing referral:",
            referralCode
        );


        const response =
            await fetch(
                API_URL +
                "/api/referral",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        initData:
                            initData,

                        referralCode:
                            referralCode

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "Referral result:",
            data
        );


        if (
            data.success &&
            !data.alreadyApplied
        ) {

            // Update local balance immediately

            if (
                typeof data.balance !==
                "undefined"
            ) {

                updateBalance(
                    data.balance
                );

            }


            tg.showAlert(
                "🎉 Referral successful!\n\n" +
                "+" +
                REFERRAL_REWARD +
                " Quicks added to the referrer's balance."
            );


            // Refresh current account

            await connectUser();

        }


        // Remove referral parameter

        if (
            window.history &&
            window.history.replaceState
        ) {

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }


    } catch (error) {

        console.error(
            "Referral processing error:",
            error
        );

    }

}


// =====================================
// START
// =====================================

async function startApp() {

    const user =
        await connectUser();


    if (user) {

        await processReferral();

    }

}


startApp();

</script></body></html>
